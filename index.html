<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Chat Overlay</title>

  <style>
    body {
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    #chat {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      padding: 10px;
    }

    .message {
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 10px;
      border-radius: 10px;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      from {
        transform: scale(0.85);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .badge {
      height: 18px;
      margin-right: 4px;
      vertical-align: middle;
      animation: badgePop 0.25s ease-out forwards;
      animation-delay: 0.2s;
    }

    @keyframes badgePop {
      0% {
        opacity: 0;
        transform: scale(0);
      }
      70% {
        opacity: 1;
        transform: scale(1.2);
      }
      100% {
        transform: scale(1);
      }
    }

    .username {
      font-weight: bold;
      margin-right: 6px;
    }

    .text {
      color: white;
      text-shadow: 0 0 4px rgba(0,0,0,0.9);
      word-wrap: break-word;
    }
  </style>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: transparent;
  display: block !important;
  opacity: 1 !important;
  visibility: visible !important;
}

body {
  background: rgba(255, 0, 0, 0.15); /* TESTE */
}
</style>
</head>
  <body>
<h1 style="color:white">OVERLAY VIVO</h1>

  <div id="chat"></div>

  <script>
    const chat = document.getElementById("chat");
    const MAX_MESSAGES = 10;
    const MESSAGE_LIFETIME = 60000;

    window.addEventListener("onEventReceived", function (obj) {
      if (obj.detail.listener !== "message") return;

      const data = obj.detail.event;
      const message = document.createElement("div");
      message.className = "message";

      if (data.badges) {
        data.badges.forEach(badge => {
          const img = document.createElement("img");
          img.src = badge.url;
          img.className = "badge";
          message.appendChild(img);
        });
      }

      const username = document.createElement("span");
      username.className = "username";
      username.style.color = data.displayColor || "#fff";
      username.textContent = data.displayName + ":";
      message.appendChild(username);

      const text = document.createElement("span");
      text.className = "text";
      text.textContent = data.text;
      message.appendChild(text);

      chat.prepend(message);

      while (chat.children.length > MAX_MESSAGES) {
        chat.removeChild(chat.lastChild);
      }

      setTimeout(() => message.remove(), MESSAGE_LIFETIME);
    });
  </script>

</body>
</html>
